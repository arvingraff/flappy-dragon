<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Iron Dragon Flap</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(#1b2a4a, #35507a 60%, #4a6a94);
  }
  #ui {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    width: 100%;
    text-align: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    pointer-events: none;
    z-index: 10;
  }
  #score {
    margin-top: 14px;
    font-size: 48px;
    font-weight: 800;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    color: #ffd23f;
    -webkit-text-stroke: 1px #7a1f00;
  }
  #best {
    font-size: 16px;
    opacity: 0.85;
    margin-top: -4px;
    color: #fff;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    text-align: center;
    background: rgba(0,0,0,0.35);
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 34px;
    margin: 0 0 6px 0;
    color: #ff5a1f;
    text-shadow: 0 0 12px rgba(255,90,20,0.8), 0 2px 4px rgba(0,0,0,0.6);
    -webkit-text-stroke: 1px #ffd23f;
  }
  #overlay p {
    font-size: 16px;
    max-width: 280px;
    margin: 4px 0 18px 0;
    opacity: 0.9;
  }
  #overlay .tapText {
    font-size: 20px;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 30px;
    background: linear-gradient(#ffcf3f, #ff5a1f);
    color: #3a0f00;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    animation: pulse 1.2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  #finalScoreRow {
    font-size: 18px;
    margin-bottom: 8px;
  }
  #medalRow {
    font-size: 40px;
    margin-bottom: 10px;
    min-height: 48px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  #medalRow .medalLabel {
    display: block;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 2px;
    opacity: 0.9;
  }
  #muteBtn, #boardBtn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-size: 20px;
    z-index: 15;
    -webkit-tap-highlight-color: transparent;
  }
  #muteBtn { right: 14px; }
  #boardBtn { right: 64px; }
  #rankInfo {
    font-size: 15px;
    font-weight: 700;
    color: #7ecbff;
    margin-bottom: 6px;
    min-height: 18px;
  }
  #leaderboardPanel {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    text-align: center;
    background: rgba(0,0,0,0.75);
    z-index: 25;
  }
  #leaderboardPanel.hidden { display: none; }
  #leaderboardPanel h2 {
    color: #ffd23f;
    margin: 0 0 10px 0;
    font-size: 24px;
  }
  #leaderboardList {
    list-style: none;
    padding: 0;
    margin: 0 0 18px 0;
    width: 240px;
    font-size: 16px;
  }
  #leaderboardList li {
    display: flex;
    justify-content: space-between;
    padding: 5px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  #leaderboardList li span:first-child { color: #ffd23f; font-weight: 700; }
  #closeBoardBtn {
    font-size: 16px;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 24px;
    border: none;
    background: linear-gradient(#ffcf3f, #ff5a1f);
    color: #3a0f00;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="score">0</div>
  <div id="best">Best: 0</div>
</div>

<button id="muteBtn">🔊</button>
<button id="boardBtn">🏆</button>

<div id="overlay">
  <h1 id="overlayTitle">IRON DRAGON</h1>
  <p id="overlaySub">Tap or press Space to flap. Dodge the pillars and villain drones, and grab shields to survive hits.</p>
  <div id="finalScoreRow" style="display:none">Score: <span id="finalScore">0</span> &nbsp;•&nbsp; Best: <span id="finalBest">0</span></div>
  <div id="medalRow"></div>
  <div id="rankInfo"></div>
  <div class="tapText" id="tapText">TAP TO START</div>
</div>

<div id="leaderboardPanel" class="hidden">
  <h2>🏆 Top 10</h2>
  <ol id="leaderboardList"></ol>
  <button id="closeBoardBtn">Close</button>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const tapText = document.getElementById('tapText');
  const finalScoreRow = document.getElementById('finalScoreRow');
  const finalScoreEl = document.getElementById('finalScore');
  const finalBestEl = document.getElementById('finalBest');
  const medalRow = document.getElementById('medalRow');
  const rankInfo = document.getElementById('rankInfo');
  const muteBtn = document.getElementById('muteBtn');
  const boardBtn = document.getElementById('boardBtn');
  const leaderboardPanel = document.getElementById('leaderboardPanel');
  const leaderboardList = document.getElementById('leaderboardList');
  const closeBoardBtn = document.getElementById('closeBoardBtn');

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Game constants ----------
  const GRAVITY = 1900;         // px/s^2
  const FLAP_VELOCITY = -560;   // px/s
  const MAX_FALL_SPEED = 900;
  const PIPE_SPEED = 190;       // px/s, scales slightly with score
  const PIPE_GAP = 190;
  const PIPE_WIDTH = 74;
  const PIPE_INTERVAL = 1450;   // ms between pipes, shrinks as score climbs
  const OSCILLATE_SCORE = 10;   // pillars start drifting after this score
  const SHIELD_MIN_GAP_SCORE = 6; // no shields before this score
  const VILLAIN_MIN_SCORE = 5;  // sky villains start appearing after this score
  const BOLT_SPEED = 420;       // px/s, villain energy bolts
  const LEADERBOARD_KEY = 'ironDragonLeaderboard';

  const STATE = { START: 'start', PLAYING: 'playing', DEAD: 'dead' };
  let state = STATE.START;

  const BEST_KEY = 'ironDragonBestScore';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
  bestEl.textContent = 'Best: ' + best;

  // ---------- Leaderboard (local top 10, stored on this device) ----------
  function loadLeaderboard() {
    try {
      const raw = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch (e) { return []; }
  }
  function saveLeaderboard(list) {
    localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list));
  }
  function addScoreToLeaderboard(s) {
    if (s <= 0) return -1;
    const list = loadLeaderboard();
    const entry = { score: s, date: new Date().toLocaleDateString(), id: Date.now() + Math.random() };
    list.push(entry);
    list.sort((a, b) => b.score - a.score);
    const trimmed = list.slice(0, 10);
    saveLeaderboard(trimmed);
    const rank = trimmed.findIndex((e) => e.id === entry.id);
    return rank === -1 ? -1 : rank + 1;
  }
  function renderLeaderboard() {
    const list = loadLeaderboard();
    leaderboardList.innerHTML = list.length
      ? list.map((e, i) => `<li><span>#${i + 1}</span><span>${e.score}</span><span>${e.date}</span></li>`).join('')
      : '<li>No scores yet — fly!</li>';
  }
  function openBoard() {
    renderLeaderboard();
    leaderboardPanel.classList.remove('hidden');
  }
  function closeBoard() {
    leaderboardPanel.classList.add('hidden');
  }
  boardBtn.addEventListener('click', (e) => { e.stopPropagation(); openBoard(); });
  closeBoardBtn.addEventListener('click', (e) => { e.stopPropagation(); closeBoard(); });

  // ---------- Audio (synthesized, no external files) ----------
  const MUTE_KEY = 'ironDragonMuted';
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  muteBtn.textContent = muted ? '🔇' : '🔊';
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* unsupported */ }
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function tone(freq, dur, type, vol, sweepTo) {
    if (muted || !audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    gain.gain.setValueAtTime(vol || 0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  }

  function sfxFlap() { tone(300, 0.1, 'sawtooth', 0.1, 160); }
  function sfxShieldUp() { tone(500, 0.18, 'sine', 0.18, 900); }
  function sfxShieldBreak() { tone(400, 0.25, 'sine', 0.2, 120); }
  function sfxPoint() { tone(660, 0.08, 'triangle', 0.1, 900); }
  function sfxZap() { tone(700, 0.14, 'sawtooth', 0.14, 200); }
  function sfxCrash() {
    if (muted || !audioCtx) return;
    const dur = 0.35;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    noise.connect(gain).connect(audioCtx.destination);
    noise.start();
  }

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    ensureAudio();
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- Dragon ----------
  const dragon = {
    x: 0,
    y: 0,
    vy: 0,
    rot: 0,
    wingPhase: 0,
    blinkTimer: 2 + Math.random() * 2,
    blinkState: 0, // 0..1, 1 = fully closed
    shielded: false,
    invulnTimer: 0, // brief flicker window after taking a hit
    size: 26 // base scale radius
  };

  function resetDragon() {
    dragon.x = Math.min(140, W * 0.28);
    dragon.y = H / 2;
    dragon.vy = 0;
    dragon.rot = 0;
    dragon.wingPhase = 0;
    dragon.shielded = false;
    dragon.invulnTimer = 0;
  }

  // ---------- Pipes ----------
  let pipes = [];
  let lastPipeTime = 0;
  let score = 0;

  function spawnPipe() {
    const margin = 60;
    const minTop = margin;
    const maxTop = H - margin - PIPE_GAP;
    const gapTop = minTop + Math.random() * Math.max(10, maxTop - minTop);
    const oscillates = score >= OSCILLATE_SCORE && Math.random() < 0.4;
    const pipe = {
      x: W + PIPE_WIDTH,
      baseGapTop: gapTop,
      gapTop: gapTop,
      passed: false,
      oscillates: oscillates,
      oscAmp: 25 + Math.random() * 35,
      oscSpeed: 0.8 + Math.random() * 0.8,
      oscPhase: Math.random() * Math.PI * 2,
      hasShield: false
    };

    if (score >= SHIELD_MIN_GAP_SCORE && !dragon.shielded && Math.random() < 0.15) {
      pipe.hasShield = true;
      pipe.shieldCollected = false;
    }

    pipes.push(pipe);
  }

  // ---------- Flame particles ----------
  let particles = [];

  // classic fire is weighted more common; plasma colors show up sometimes for variety
  const FLAME_PALETTES = [
    ['255,255,220', '255,220,60', '255,120,20'],  // classic orange fire
    ['255,255,220', '255,220,60', '255,120,20'],  // classic orange fire (weighted)
    ['255,240,255', '140,210,255', '20,110,255'], // blue plasma
    ['235,255,225', '130,255,120', '20,190,60'],  // green energy
    ['255,235,255', '230,140,255', '150,20,220']  // purple energy
  ];

  function spawnFlame(intensity) {
    // emit from behind the dragon (tail thruster); only called on an active flap press
    const backX = dragon.x - dragon.size * 1.05;
    const backY = dragon.y + dragon.size * 0.15;
    const count = intensity ? 9 : 3;
    const palette = FLAME_PALETTES[Math.floor(Math.random() * FLAME_PALETTES.length)];
    for (let i = 0; i < count; i++) {
      const angle = Math.PI + (Math.random() - 0.5) * 0.7;
      const speed = (intensity ? 280 : 140) + Math.random() * 130;
      particles.push({
        x: backX,
        y: backY + (Math.random() - 0.5) * 10,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.5 - 20,
        life: 0,
        maxLife: 0.35 + Math.random() * 0.25,
        size: 6 + Math.random() * 7 * (intensity ? 1.5 : 1),
        kind: 'flame',
        palette: palette
      });
    }
  }

  function spawnSparks(x, y, color1, color2, count) {
    for (let i = 0; i < (count || 14); i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 80 + Math.random() * 220;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0,
        maxLife: 0.35 + Math.random() * 0.35,
        size: 3 + Math.random() * 4,
        kind: 'spark',
        c1: color1,
        c2: color2
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= p.kind === 'spark' ? 0.9 : 0.94;
      p.vy = p.vy * (p.kind === 'spark' ? 0.9 : 0.94) + (p.kind === 'spark' ? 260 : 40) * dt;
      if (p.life >= p.maxLife) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const t = p.life / p.maxLife; // 0 -> 1
      const alpha = 1 - t;
      const size = p.size * (1 - t * 0.6);
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size);
      if (p.kind === 'spark') {
        grad.addColorStop(0, p.c1 || `rgba(255,255,255,${alpha})`);
        grad.addColorStop(1, p.c2 || `rgba(255,210,63,0)`);
      } else {
        const [c1, c2, c3] = p.palette || ['255,255,220', '255,220,60', '255,120,20'];
        if (t < 0.4) {
          grad.addColorStop(0, `rgba(${c1},${alpha})`);
          grad.addColorStop(0.4, `rgba(${c2},${alpha})`);
          grad.addColorStop(1, `rgba(${c3},0)`);
        } else {
          grad.addColorStop(0, `rgba(${c2},${alpha * 0.9})`);
          grad.addColorStop(0.5, `rgba(${c3},${alpha * 0.6})`);
          grad.addColorStop(1, `rgba(${c3},0)`);
        }
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- Floating score popups ----------
  let popups = [];
  function spawnPopup(x, y, text, color) {
    popups.push({ x, y, text, color: color || '#ffd23f', life: 0, maxLife: 0.9 });
  }
  function updatePopups(dt) {
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.life += dt;
      p.y -= 40 * dt;
      if (p.life >= p.maxLife) popups.splice(i, 1);
    }
  }
  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = '700 20px -apple-system, sans-serif';
    for (const p of popups) {
      const t = p.life / p.maxLife;
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Screen shake / flash (crash juice) ----------
  let shakeTime = 0;
  let shakeMag = 0;
  let flashAlpha = 0;
  function triggerShake(mag) {
    shakeTime = 0.35;
    shakeMag = mag;
    flashAlpha = 0.55;
  }

  // ---------- Sky villains (original flying robot enemies, not tied to any franchise) ----------
  let villains = [];
  let bolts = [];
  let lastVillainTime = 0;

  // a small roster of distinct original villain designs for variety
  const VILLAIN_TYPES = [
    {
      name: 'Void Reaper',
      body: ['#5a3a7a', '#3a2050', '#1a0e2a'],
      cape: ['#3a1a52', '#1a0a2a'],
      spike: '#2fae5a',
      visor: '255,90,90',
      boltColor: ['230,150,255', '150,60,220'],
      spread: 1,
      sizeMul: 1
    },
    {
      name: 'Toxic Warbot',
      body: ['#3a6a3a', '#204a20', '#0e2a0e'],
      cape: ['#1a4a1a', '#0a2a0a'],
      spike: '#ffd23f',
      visor: '160,255,120',
      boltColor: ['200,255,150', '80,220,60'],
      spread: 1,
      sizeMul: 1.15
    },
    {
      name: 'Steel Warlord',
      body: ['#7a8a9a', '#4a5560', '#20262c'],
      cape: ['#3a4550', '#1a2025'],
      spike: '#ff5a1f',
      visor: '255,170,60',
      boltColor: ['255,210,150', '255,120,20'],
      spread: 2,
      sizeMul: 0.95,
      zigzag: true
    }
  ];

  function spawnVillain(speed) {
    const margin = 90;
    const type = VILLAIN_TYPES[Math.floor(Math.random() * VILLAIN_TYPES.length)];
    villains.push({
      x: W + 60,
      baseY: margin + Math.random() * (H - margin * 2),
      y: 0,
      vx: speed * (0.85 + Math.random() * 0.25),
      bobAmp: (type.zigzag ? 55 : 30) + Math.random() * 40,
      bobSpeed: (type.zigzag ? 1.4 : 0.6) + Math.random() * 0.6,
      phase: Math.random() * Math.PI * 2,
      size: (30 + Math.random() * 8) * type.sizeMul,
      shootTimer: 1 + Math.random() * 1.2,
      flash: 0,
      type: type
    });
  }

  function shootBolt(v) {
    const dx = dragon.x - v.x;
    const dy = dragon.y - v.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const baseAngle = Math.atan2(dy, dx);
    const spreadCount = v.type.spread || 1;
    const spreadStep = 0.22;
    for (let i = 0; i < spreadCount; i++) {
      const offset = (i - (spreadCount - 1) / 2) * spreadStep;
      const a = baseAngle + offset;
      bolts.push({
        x: v.x - v.size * 0.6,
        y: v.y,
        vx: Math.cos(a) * BOLT_SPEED,
        vy: Math.sin(a) * BOLT_SPEED,
        color: v.type.boltColor
      });
    }
    sfxZap();
    v.flash = 0.15;
  }

  function updateVillains(dt, time, speed) {
    const nextInterval = Math.max(1800, 4200 - score * 40);
    if (score >= VILLAIN_MIN_SCORE) {
      lastVillainTime += dt * 1000;
      if (lastVillainTime >= nextInterval) {
        lastVillainTime = 0;
        spawnVillain(speed);
      }
    }

    const dr = dragon.size * 0.55;
    for (let i = villains.length - 1; i >= 0; i--) {
      const v = villains[i];
      v.x -= v.vx * dt;
      v.y = v.baseY + Math.sin(time / 1000 * v.bobSpeed + v.phase) * v.bobAmp;
      if (v.flash > 0) v.flash -= dt;

      v.shootTimer -= dt;
      if (v.shootTimer <= 0 && v.x > 60 && v.x < W - 20) {
        shootBolt(v);
        v.shootTimer = Math.max(1.1, 2.6 - score * 0.02) + Math.random() * 0.8;
      }

      const dx = dragon.x - v.x, dy = dragon.y - v.y;
      if (dx * dx + dy * dy < (dr + v.size * 0.6) * (dr + v.size * 0.6)) {
        hitDragon(true);
      }

      if (v.x < -80) villains.splice(i, 1);
    }

    const br = 7;
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      const dx = dragon.x - b.x, dy = dragon.y - b.y;
      if (dx * dx + dy * dy < (dr + br) * (dr + br)) {
        hitDragon(true);
        bolts.splice(i, 1);
        continue;
      }
      if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) bolts.splice(i, 1);
    }
  }

  function drawVillain(v, time) {
    ctx.save();
    ctx.translate(v.x, v.y);
    const s = v.size;
    const t = v.type;

    // trailing cape/fin (streams to the right since it flies leftward)
    ctx.beginPath();
    ctx.moveTo(s * 0.2, -s * 0.5);
    ctx.quadraticCurveTo(s * 1.3, -s * 0.1, s * 0.9, s * 0.6);
    ctx.quadraticCurveTo(s * 0.5, s * 0.15, s * 0.15, s * 0.4);
    ctx.closePath();
    const capeGrad = ctx.createLinearGradient(0, 0, s * 1.3, 0);
    capeGrad.addColorStop(0, t.cape[0]);
    capeGrad.addColorStop(1, t.cape[1]);
    ctx.fillStyle = capeGrad;
    ctx.fill();

    // metallic body (original armored-villain design, unique per type)
    const bodyGrad = ctx.createRadialGradient(-s * 0.2, -s * 0.2, s * 0.1, 0, 0, s);
    bodyGrad.addColorStop(0, t.body[0]);
    bodyGrad.addColorStop(0.6, t.body[1]);
    bodyGrad.addColorStop(1, t.body[2]);
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.85, s * 0.7, 0, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = '#0a0512';
    ctx.lineWidth = 2;
    ctx.stroke();

    // shoulder spikes
    ctx.fillStyle = t.spike;
    [[-0.55, -0.5], [0.55, -0.5]].forEach(([sx, sy]) => {
      ctx.beginPath();
      ctx.moveTo(sx * s - s * 0.15, sy * s + s * 0.2);
      ctx.lineTo(sx * s, sy * s - s * 0.35);
      ctx.lineTo(sx * s + s * 0.15, sy * s + s * 0.2);
      ctx.closePath();
      ctx.fill();
    });

    // glowing visor/eye band (menacing, fully original per type)
    const visorGlow = 0.7 + 0.3 * Math.sin(time / 140);
    ctx.beginPath();
    ctx.ellipse(-s * 0.15, -s * 0.05, s * 0.5, s * 0.14, 0, 0, Math.PI * 2);
    const visorGrad = ctx.createRadialGradient(-s * 0.15, -s * 0.05, 0, -s * 0.15, -s * 0.05, s * 0.5);
    visorGrad.addColorStop(0, `rgba(${t.visor},${visorGlow})`);
    visorGrad.addColorStop(1, `rgba(${t.visor.split(',')[0]},0,0,0)`);
    ctx.fillStyle = visorGrad;
    ctx.fill();

    // charge flash right before shooting
    if (v.flash > 0) {
      ctx.beginPath();
      ctx.arc(-s * 0.75, -s * 0.05, s * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,220,150,${v.flash * 4})`;
      ctx.fill();
    }

    ctx.restore();
  }

  function drawVillains(time) {
    for (const v of villains) drawVillain(v, time);
  }

  function drawBolts() {
    for (const b of bolts) {
      ctx.save();
      ctx.translate(b.x, b.y);
      const [c1, c2] = b.color || ['230,150,255', '150,60,220'];
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 14);
      glow.addColorStop(0, `rgba(${c1},0.95)`);
      glow.addColorStop(0.5, `rgba(${c2},0.7)`);
      glow.addColorStop(1, `rgba(${c2},0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---------- Input ----------
  function flap() {
    ensureAudio();
    if (state === STATE.START) {
      startGame();
      return;
    }
    if (state === STATE.DEAD) {
      startGame();
      return;
    }
    dragon.vy = FLAP_VELOCITY;
    spawnFlame(true);
    sfxFlap();
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });
  window.addEventListener('touchstart', (e) => {
    if (e.target === muteBtn || e.target === boardBtn || leaderboardPanel.contains(e.target)) return;
    e.preventDefault();
    flap();
  }, { passive: false });
  window.addEventListener('mousedown', (e) => {
    if (e.target === muteBtn || e.target === boardBtn || leaderboardPanel.contains(e.target)) return;
    flap();
  });

  // ---------- Game flow ----------
  function startGame() {
    state = STATE.PLAYING;
    pipes = [];
    particles = [];
    popups = [];
    villains = [];
    bolts = [];
    lastVillainTime = 0;
    score = 0;
    lastPipeTime = 0;
    shakeTime = 0;
    flashAlpha = 0;
    resetDragon();
    scoreEl.textContent = '0';
    medalRow.innerHTML = '';
    rankInfo.textContent = '';
    boardBtn.style.display = 'none';
    closeBoard();
    overlay.classList.add('hidden');
  }

  function getMedal(s) {
    if (s >= 60) return { icon: '💎', label: 'PLATINUM' };
    if (s >= 35) return { icon: '🥇', label: 'GOLD' };
    if (s >= 20) return { icon: '🥈', label: 'SILVER' };
    if (s >= 8) return { icon: '🥉', label: 'BRONZE' };
    return null;
  }

  function endGame() {
    state = STATE.DEAD;
    sfxCrash();
    triggerShake(16);
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    bestEl.textContent = 'Best: ' + best;
    overlayTitle.textContent = 'CRASHED!';
    overlaySub.textContent = 'Your thrusters overheated. Try again!';
    finalScoreRow.style.display = 'block';
    finalScoreEl.textContent = String(score);
    finalBestEl.textContent = String(best);
    const medal = getMedal(score);
    medalRow.innerHTML = medal ? `${medal.icon}<span class="medalLabel">${medal.label}</span>` : '';
    const rank = addScoreToLeaderboard(score);
    rankInfo.textContent = rank > 0 ? `🏆 New Top 10! Rank #${rank}` : '';
    boardBtn.style.display = 'flex';
    tapText.textContent = 'TAP TO RETRY';
    overlay.classList.remove('hidden');
  }

  function circleRectCollide(cx, cy, cr, rx, ry, rw, rh) {
    const nearestX = Math.max(rx, Math.min(cx, rx + rw));
    const nearestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nearestX;
    const dy = cy - nearestY;
    return (dx * dx + dy * dy) < (cr * cr);
  }

  function hitDragon(pushX) {
    if (dragon.invulnTimer > 0) return;
    if (dragon.shielded) {
      dragon.shielded = false;
      dragon.invulnTimer = 1.0;
      dragon.vy = -260;
      if (pushX) dragon.x -= 4;
      sfxShieldBreak();
      spawnSparks(dragon.x, dragon.y, 'rgba(140,210,255,0.9)', 'rgba(60,140,255,0)', 22);
      triggerShake(8);
      return;
    }
    endGame();
  }

  // ---------- Drawing ----------
  function drawBackground(time) {
    // day-to-dusk progression tied to score for visual variety
    const duskT = Math.min(1, score / 45);
    const topColor = lerpColor([18, 33, 63], [30, 14, 46], duskT);
    const midColor = lerpColor([44, 74, 117], [82, 40, 74], duskT);
    const botColor = lerpColor([77, 112, 153], [168, 92, 74], duskT);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, topColor);
    g.addColorStop(0.55, midColor);
    g.addColorStop(1, botColor);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // twinkling stars fade in with dusk progression
    if (duskT > 0.15) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.9, (duskT - 0.15) * 1.2);
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 137.5) % W;
        const sy = (i * 71.3) % (H * 0.55);
        const twinkle = 0.5 + 0.5 * Math.sin(time / 500 + i);
        ctx.globalAlpha = Math.min(0.9, (duskT - 0.15) * 1.2) * twinkle;
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.restore();
    }

    // soft parallax clouds
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#fff';
    const cloudOffset = (time / 40) % (W + 200);
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 260) - cloudOffset + W + 200) % (W + 200) - 100;
      const cy = 60 + (i % 3) * 90;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 60, 22, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 40, cy + 6, 40, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // distant city/mountain skyline silhouette (slow parallax)
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = lerpColor([12, 20, 38], [20, 8, 30], duskT);
    const skyOffset = (time / 18) % (W + 240);
    const baseY = H * 0.78;
    for (let i = 0; i < 6; i++) {
      const bx = ((i * 220) - skyOffset + W + 240) % (W + 240) - 120;
      const bw = 60 + (i % 3) * 20;
      const bh = 70 + (i % 4) * 35;
      ctx.fillRect(bx, baseY - bh, bw, bh);
      // antenna spike for variety
      if (i % 2 === 0) {
        ctx.fillRect(bx + bw / 2 - 2, baseY - bh - 18, 4, 18);
      }
    }
    ctx.restore();
  }

  function lerpColor(a, b, t) {
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function drawPipes(time) {
    for (const p of pipes) {
      const topH = p.gapTop;
      const botY = p.gapTop + PIPE_GAP;
      const botH = H - botY;

      // metallic red/yellow hazard-striped pillars (Iron Man vibe)
      drawPillar(p.x, 0, PIPE_WIDTH, topH, true, p.oscillates);
      drawPillar(p.x, botY, PIPE_WIDTH, botH, false, p.oscillates);

      if (p.hasShield && !p.shieldCollected) {
        drawShieldPickup(p.x + PIPE_WIDTH / 2, p.gapTop + PIPE_GAP / 2, time);
      }
    }
  }

  function drawPillar(x, y, w, h, isTop, oscillates) {
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#7a1f00');
    grad.addColorStop(0.15, '#c23b12');
    grad.addColorStop(0.5, oscillates ? '#ff9a4e' : '#ff7a2e');
    grad.addColorStop(0.85, '#c23b12');
    grad.addColorStop(1, '#5c1400');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    // hazard stripes edge cap
    const capH = 22;
    const capY = isTop ? y + h - capH : y;
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(x - 6, capY, w + 12, capH);
    ctx.strokeStyle = oscillates ? '#3fd0ff' : '#111';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 6, capY, w + 12, capH);

    // yellow/black hazard stripes on cap
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - 6, capY, w + 12, capH);
    ctx.clip();
    ctx.fillStyle = '#ffd23f';
    const stripeW = 14;
    for (let sx = x - 6 - capH; sx < x + w + 12; sx += stripeW * 2) {
      ctx.save();
      ctx.translate(sx, capY);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(0, -20, stripeW, capH + 40);
      ctx.restore();
    }
    ctx.restore();

    // rivets
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (let ry = y + 10; ry < y + h - 10; ry += 26) {
      ctx.beginPath();
      ctx.arc(x + 6, ry, 2.5, 0, Math.PI * 2);
      ctx.arc(x + w - 6, ry, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawShieldPickup(x, y, time) {
    const bob = Math.sin(time / 300 + x) * 6;
    const py = y + bob;
    ctx.save();
    ctx.translate(x, py);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 26);
    glow.addColorStop(0, 'rgba(120,200,255,0.5)');
    glow.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(time / 900);
    const r = 14;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 2;
      const px = Math.cos(a) * r, pyy = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, pyy); else ctx.lineTo(px, pyy);
    }
    ctx.closePath();
    const hexGrad = ctx.createLinearGradient(-r, -r, r, r);
    hexGrad.addColorStop(0, '#eaf9ff');
    hexGrad.addColorStop(0.5, '#7ecbff');
    hexGrad.addColorStop(1, '#2a6fbf');
    ctx.fillStyle = hexGrad;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.strokeStyle = '#eaf9ff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function drawDragon(time) {
    const d = dragon;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);

    // flicker while briefly invulnerable after a shield break
    if (d.invulnTimer > 0 && Math.floor(time / 80) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    }

    const s = d.size;
    const flap = Math.sin(d.wingPhase) * 0.5 + 0.5; // 0..1
    const legTuck = Math.sin(d.wingPhase * 0.5) * 0.15;

    // ---- back leg (tucked under belly) ----
    ctx.save();
    ctx.translate(-s * 0.15, s * 0.55);
    ctx.rotate(0.3 + legTuck);
    drawLeg(s * 0.55, '#7a1f00');
    ctx.restore();

    // ---- back wing (mechanical plate) ----
    ctx.save();
    ctx.translate(-s * 0.3, 0);
    ctx.rotate(-0.5 - flap * 0.6);
    drawWing(s, '#8a1a00', '#3fd0ff');
    ctx.restore();

    // ---- tail with thruster ----
    ctx.beginPath();
    ctx.moveTo(-s * 0.9, s * 0.1);
    ctx.quadraticCurveTo(-s * 1.55, s * 0.42, -s * 1.85, s * 0.08);
    ctx.quadraticCurveTo(-s * 1.55, s * 0.05, -s * 1.85, -s * 0.28);
    ctx.quadraticCurveTo(-s * 1.5, s * 0.02, -s * 0.8, -s * 0.05);
    ctx.closePath();
    const tailGrad = ctx.createLinearGradient(-s * 1.9, 0, -s * 0.8, 0);
    tailGrad.addColorStop(0, '#b31d00');
    tailGrad.addColorStop(1, '#ff3d00');
    ctx.fillStyle = tailGrad;
    ctx.fill();
    ctx.strokeStyle = '#5c1400';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // thruster nozzle ring + glow (afterburner look, always lit while playing)
    const nozzleX = -s * 1.85, nozzleY = -s * 0.08;
    const nozzleGlow = ctx.createRadialGradient(nozzleX, nozzleY, 0, nozzleX, nozzleY, s * 0.55);
    nozzleGlow.addColorStop(0, 'rgba(255,235,160,0.9)');
    nozzleGlow.addColorStop(0.4, 'rgba(255,140,20,0.6)');
    nozzleGlow.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = nozzleGlow;
    ctx.beginPath();
    ctx.arc(nozzleX, nozzleY, s * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(nozzleX, nozzleY, s * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = '#3a2a1a';
    ctx.fill();
    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 2;
    ctx.stroke();

    // ---- body ----
    const bodyGrad = ctx.createLinearGradient(-s, -s, s, s);
    bodyGrad.addColorStop(0, '#ff2d00');
    bodyGrad.addColorStop(0.5, '#ff5a1f');
    bodyGrad.addColorStop(1, '#c21e00');
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 1.05, s * 0.78, 0, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#5c1400';
    ctx.stroke();

    // back spikes row (Iron-Man gold, mechanical)
    for (let i = 0; i < 4; i++) {
      const px = s * (0.55 - i * 0.35);
      const py = -Math.sqrt(Math.max(0, (s * 0.78) ** 2 * (1 - (px / (s * 1.05)) ** 2))) * 0.95;
      const spH = s * (0.32 - i * 0.03);
      ctx.beginPath();
      ctx.moveTo(px - s * 0.13, py + 2);
      ctx.lineTo(px, py - spH);
      ctx.lineTo(px + s * 0.13, py + 2);
      ctx.closePath();
      ctx.fillStyle = '#ffd23f';
      ctx.fill();
      ctx.strokeStyle = '#a86a00';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // ---- front leg ----
    ctx.save();
    ctx.translate(s * 0.2, s * 0.55);
    ctx.rotate(0.15 - legTuck);
    drawLeg(s * 0.6, '#ff5a1f');
    ctx.restore();

    // gold chest plate / armor accent (Iron Man style)
    ctx.beginPath();
    ctx.ellipse(s * 0.05, s * 0.05, s * 0.55, s * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd23f';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(s * 0.05, s * 0.05, s * 0.3, s * 0.22, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9a00';
    ctx.fill();

    // arc-reactor glow dot, pulsing like a heartbeat
    const reactorPulse = 0.85 + 0.25 * Math.sin(time / 220);
    ctx.beginPath();
    ctx.arc(s * 0.05, s * 0.05, s * 0.12 * reactorPulse, 0, Math.PI * 2);
    const glowGrad = ctx.createRadialGradient(s * 0.05, s * 0.05, 0, s * 0.05, s * 0.05, s * 0.12 * reactorPulse);
    glowGrad.addColorStop(0, '#eafcff');
    glowGrad.addColorStop(0.5, '#8fe8ff');
    glowGrad.addColorStop(1, '#2a9fd6');
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // plate rivets
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    [[-0.35,-0.15], [0.4,-0.2], [-0.2,0.3], [0.35,0.28]].forEach(([px,py]) => {
      ctx.beginPath();
      ctx.arc(px * s, py * s, s * 0.045, 0, Math.PI * 2);
      ctx.fill();
    });

    // ---- head / snout ----
    ctx.beginPath();
    ctx.moveTo(s * 0.7, -s * 0.4);
    ctx.quadraticCurveTo(s * 1.5, -s * 0.18, s * 1.55, s * 0.05);
    ctx.quadraticCurveTo(s * 1.5, s * 0.28, s * 0.78, s * 0.3);
    ctx.closePath();
    ctx.fillStyle = '#ff5a1f';
    ctx.fill();
    ctx.stroke();

    // brow ridge
    ctx.beginPath();
    ctx.moveTo(s * 0.78, -s * 0.28);
    ctx.quadraticCurveTo(s * 1.05, -s * 0.42, s * 1.3, -s * 0.28);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffd23f';
    ctx.stroke();

    // jaw line + small teeth
    ctx.beginPath();
    ctx.moveTo(s * 0.85, s * 0.14);
    ctx.lineTo(s * 1.4, s * 0.12);
    ctx.strokeStyle = '#7a1f00';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#fff8e0';
    for (let i = 0; i < 3; i++) {
      const tx = s * 0.95 + i * s * 0.16;
      ctx.beginPath();
      ctx.moveTo(tx, s * 0.14);
      ctx.lineTo(tx + s * 0.05, s * 0.14);
      ctx.lineTo(tx + s * 0.025, s * 0.22);
      ctx.closePath();
      ctx.fill();
    }

    // double horns (mechanical, yellow)
    ctx.beginPath();
    ctx.moveTo(s * 0.62, -s * 0.5);
    ctx.lineTo(s * 0.46, -s * 0.92);
    ctx.lineTo(s * 0.82, -s * 0.58);
    ctx.closePath();
    ctx.fillStyle = '#ffd23f';
    ctx.fill();
    ctx.strokeStyle = '#a86a00';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s * 0.85, -s * 0.48);
    ctx.lineTo(s * 0.78, -s * 0.78);
    ctx.lineTo(s * 1.02, -s * 0.5);
    ctx.closePath();
    ctx.fillStyle = '#ffb92e';
    ctx.fill();
    ctx.stroke();

    // ear fin
    ctx.beginPath();
    ctx.moveTo(s * 0.5, -s * 0.2);
    ctx.quadraticCurveTo(s * 0.3, -s * 0.05, s * 0.45, s * 0.12);
    ctx.closePath();
    ctx.fillStyle = '#c21e00';
    ctx.fill();

    // eye (glowing, with blink)
    const eyeOpen = 1 - d.blinkState;
    ctx.beginPath();
    ctx.ellipse(s * 1.05, -s * 0.06, s * 0.11, Math.max(0.01, s * 0.11 * eyeOpen), 0, 0, Math.PI * 2);
    const eyeGrad = ctx.createRadialGradient(s * 1.05, -s * 0.06, 0, s * 1.05, -s * 0.06, s * 0.11);
    eyeGrad.addColorStop(0, '#fff9d0');
    eyeGrad.addColorStop(0.5, '#ffe14d');
    eyeGrad.addColorStop(1, '#ff8a00');
    ctx.fillStyle = eyeGrad;
    ctx.fill();

    // snout tip (yellow highlight)
    ctx.beginPath();
    ctx.moveTo(s * 1.4, -s * 0.05);
    ctx.lineTo(s * 1.55, s * 0.05);
    ctx.lineTo(s * 1.35, s * 0.18);
    ctx.closePath();
    ctx.fillStyle = '#ffd23f';
    ctx.fill();

    // shoulder mini-thruster puffs (subtle, syncing with flap)
    if (flap > 0.6) {
      ctx.save();
      ctx.globalAlpha = (flap - 0.6) * 2;
      const puffGrad = ctx.createRadialGradient(-s * 0.1, -s * 0.35, 0, -s * 0.1, -s * 0.35, s * 0.3);
      puffGrad.addColorStop(0, 'rgba(255,220,140,0.8)');
      puffGrad.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.fillStyle = puffGrad;
      ctx.beginPath();
      ctx.arc(-s * 0.1, -s * 0.35, s * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ---- front wing (on top, mechanical plate) ----
    ctx.save();
    ctx.translate(s * 0.05, -s * 0.05);
    ctx.rotate(-0.3 + flap * 0.8);
    drawWing(s, '#ff7a2e', '#5fe0ff');
    ctx.restore();

    ctx.restore();

    // shield bubble overlay (drawn in world space, not rotated with body for stability)
    if (d.shielded) {
      ctx.save();
      ctx.translate(d.x, d.y);
      const pulse = 0.9 + 0.1 * Math.sin(time / 160);
      ctx.beginPath();
      ctx.arc(0, 0, s * 1.7 * pulse, 0, Math.PI * 2);
      const shieldGrad = ctx.createRadialGradient(0, 0, s * 1.1, 0, 0, s * 1.7 * pulse);
      shieldGrad.addColorStop(0, 'rgba(120,200,255,0)');
      shieldGrad.addColorStop(0.8, 'rgba(120,200,255,0.25)');
      shieldGrad.addColorStop(1, 'rgba(180,230,255,0.55)');
      ctx.fillStyle = shieldGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(220,245,255,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }

  function drawLeg(len, color) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.3, len * 0.5, len * 0.15, len * 0.9);
    ctx.lineTo(-len * 0.15, len * 0.9);
    ctx.quadraticCurveTo(-len * 0.05, len * 0.5, -len * 0.1, 0);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#3a0e00';
    ctx.lineWidth = 1;
    ctx.stroke();
    // claws
    ctx.fillStyle = '#2a2a2a';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(len * 0.15 * i, len * 0.9);
      ctx.lineTo(len * 0.15 * i - 3, len * 1.05);
      ctx.lineTo(len * 0.15 * i + 3, len * 0.92);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawWing(s, color, energyColor) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(s * 0.6, -s * 0.9, s * 1.3, -s * 0.55);
    ctx.quadraticCurveTo(s * 0.7, -s * 0.35, s * 0.55, 0.05 * s);
    ctx.quadraticCurveTo(s * 0.35, s * 0.15, 0, 0.05 * s);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#3a0e00';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // glowing energy vane lines (arc-reactor blue, Iron Man accent)
    ctx.strokeStyle = energyColor || 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(s * 0.15, -s * 0.05);
    ctx.lineTo(s * 1.05, -s * 0.5);
    ctx.moveTo(s * 0.1, s * 0.0);
    ctx.lineTo(s * 0.75, -s * 0.3);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- Main loop ----------
  let lastTime = 0;

  function update(dt, time) {
    dragon.wingPhase += dt * (state === STATE.PLAYING ? 14 : 4);

    // blink animation
    dragon.blinkTimer -= dt;
    if (dragon.blinkTimer <= 0) {
      dragon.blinkState = Math.min(1, dragon.blinkState + dt * 14);
      if (dragon.blinkState >= 1) dragon.blinkTimer = 2 + Math.random() * 3;
    } else if (dragon.blinkState > 0) {
      dragon.blinkState = Math.max(0, dragon.blinkState - dt * 14);
    }

    if (dragon.invulnTimer > 0) dragon.invulnTimer -= dt;

    if (shakeTime > 0) shakeTime -= dt;
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 1.8);

    if (state !== STATE.PLAYING) {
      // idle bob on start screen (no flames until the player actually presses)
      if (state === STATE.START) {
        dragon.y = H / 2 + Math.sin(time / 350) * 14;
      }
      updateParticles(dt);
      updatePopups(dt);
      return;
    }

    // physics
    dragon.vy += GRAVITY * dt;
    if (dragon.vy > MAX_FALL_SPEED) dragon.vy = MAX_FALL_SPEED;
    dragon.y += dragon.vy * dt;
    dragon.rot = Math.max(-0.5, Math.min(1.1, dragon.vy / 700));

    // difficulty ramps up continuously: pipes get faster and spawn more often as score climbs
    const speed = PIPE_SPEED + Math.min(360, score * 7);
    const pipeInterval = Math.max(700, PIPE_INTERVAL - score * 9);
    lastPipeTime += dt * 1000;
    if (lastPipeTime >= pipeInterval) {
      lastPipeTime = 0;
      spawnPipe();
    }

    // move pipes & scoring & collision
    const dr = dragon.size * 0.55; // collision radius, forgiving
    const shieldR = dragon.size * 0.75;
    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= speed * dt;
      if (p.oscillates) {
        const margin = 40;
        const minTop = margin;
        const maxTop = H - margin - PIPE_GAP;
        p.gapTop = Math.max(minTop, Math.min(maxTop,
          p.baseGapTop + Math.sin(time / 1000 * p.oscSpeed + p.oscPhase) * p.oscAmp));
      }

      if (!p.passed && p.x + PIPE_WIDTH < dragon.x - dragon.size) {
        p.passed = true;
        score++;
        scoreEl.textContent = String(score);
        sfxPoint();
      }

      // shield pickup
      if (p.hasShield && !p.shieldCollected) {
        const ox = p.x + PIPE_WIDTH / 2, oy = p.gapTop + PIPE_GAP / 2;
        const dx = dragon.x - ox, dy = dragon.y - oy;
        if (dx * dx + dy * dy < (shieldR + 14) * (shieldR + 14)) {
          p.shieldCollected = true;
          dragon.shielded = true;
          sfxShieldUp();
          spawnPopup(ox, oy, 'SHIELD!', '#7ecbff');
          spawnSparks(ox, oy, 'rgba(200,235,255,0.9)', 'rgba(60,140,255,0)', 16);
        }
      }

      const topH = p.gapTop;
      const botY = p.gapTop + PIPE_GAP;
      if (circleRectCollide(dragon.x, dragon.y, dr, p.x, 0, PIPE_WIDTH, topH) ||
          circleRectCollide(dragon.x, dragon.y, dr, p.x, botY, PIPE_WIDTH, H - botY)) {
        hitDragon(true);
      }

      if (p.x + PIPE_WIDTH < -10) pipes.splice(i, 1);
    }

    // ground / ceiling collision
    if (dragon.y + dr > H || dragon.y - dr < 0) {
      dragon.y = Math.max(dr, Math.min(H - dr, dragon.y));
      hitDragon(false);
    }

    updateVillains(dt, time, speed);
    updateParticles(dt);
    updatePopups(dt);
  }

  function render(time) {
    ctx.save();
    if (shakeTime > 0) {
      const m = shakeMag * (shakeTime / 0.35);
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    drawBackground(time);
    drawPipes(time);
    drawVillains(time);
    drawBolts();
    drawParticles();
    drawDragon(time);
    drawPopups();
    ctx.restore();

    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,40,20,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(time) {
    if (!lastTime) lastTime = time;
    let dt = (time - lastTime) / 1000;
    dt = Math.min(dt, 0.033); // clamp for stability
    lastTime = time;

    update(dt, time);
    render(time);

    requestAnimationFrame(loop);
  }

  resetDragon();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
